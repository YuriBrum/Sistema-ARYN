<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARYN - Meus Pedidos</title>

    <link rel="stylesheet" href="../assets/styles/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/styles/usuario.css">

    <script src="../assets/js/autentificao.js"></script>
    <script src="../assets/js/carrinho.js"></script>

    <style>
        .pedidos-lista {
            display: grid;
            gap: 20px;
            margin-top: 25px;
        }

        .pedido-card {
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);
            overflow: hidden;
        }

        .pedido-topo {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            padding: 16px 22px;
            background: #111;
            color: #fff;
        }

        .pedido-topo .numero {
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .pedido-topo .data-pedido {
            font-size: 13px;
            color: #bbb;
        }

        .status-badge {
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 13px;
            background: #1a7a1a;
            color: #fff;
            font-weight: bold;
        }

        .pedido-corpo {
            padding: 8px 22px;
        }

        .pedido-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .pedido-item:last-child {
            border-bottom: 0;
        }

        .pedido-item img {
            width: 64px;
            height: 64px;
            object-fit: contain;
            border-radius: 10px;
            background: #f6f6f6;
            border: 1px solid #eee;
            padding: 4px;
        }

        .pedido-item .info {
            flex: 1;
            min-width: 0;
        }

        .pedido-item .info .nome {
            font-weight: bold;
            color: #111;
            margin: 0 0 4px;
        }

        .pedido-item .info .detalhes {
            font-size: 13px;
            color: #888;
            margin: 0;
        }

        .pedido-item .valor-item {
            text-align: right;
            white-space: nowrap;
        }

        .pedido-item .valor-item .unit {
            font-size: 13px;
            color: #888;
            margin: 0 0 3px;
        }

        .pedido-item .valor-item .total {
            font-weight: bold;
            color: #111;
            font-size: 15px;
            margin: 0;
        }

        .pedido-rodape {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            padding: 16px 22px;
            background: #fafafa;
            border-top: 1px solid #eee;
        }

        .pedido-entrega {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13.5px;
            color: #555;
        }

        .pedido-entrega i {
            color: #d91d1d;
            font-size: 18px;
        }

        .pedido-entrega strong {
            color: #111;
        }

        .pedido-total-final {
            text-align: right;
        }

        .pedido-total-final small {
            display: block;
            font-size: 12px;
            color: #888;
        }

        .pedido-total-final strong {
            font-size: 20px;
            color: #111;
        }

        .vazio {
            background: #fff;
            border-radius: 14px;
            padding: 55px 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);
            text-align: center;
        }

        .vazio i {
            font-size: 55px;
            color: #aaa;
            margin-bottom: 15px;
        }

        .vazio h3 {
            margin: 0 0 8px;
            font-size: 22px;
            color: #111;
        }

        .vazio p {
            margin: 0 0 20px;
            color: #666;
        }

        .vazio a.continuar {
            display: inline-block;
            text-decoration: none;
            background: #111;
            color: #fff;
            padding: 12px 26px;
            border-radius: 7px;
            font-weight: bold;
            font-size: 14px;
        }

        .vazio a.continuar:hover {
            background: #000;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">
        <h1><span>A</span>RYN</h1>
        <p>Vista sua essência</p>
    </div>

    <nav>
        <a href="../../index.html">
            <i class="fa-solid fa-house"></i>
            Home
        </a>

        <a href="masculino.html">
            <i class="fa-solid fa-person"></i>
            Masculino
        </a>

        <a href="feminino.html">
            <i class="fa-solid fa-person-dress"></i>
            Feminino
        </a>
    </nav>

    <nav>
        <a href="../../index.html">
            <i class="fa-solid fa-store"></i>
            Loja
        </a>

        <a href="carrinho.html">
            <i class="fa-solid fa-cart-shopping"></i>
            Carrinho
        </a>

        <a href="curtidas.html">
            <i class="fa-solid fa-heart"></i>
            Curtidas
        </a>

        <a href="usuarios.html">
            <i class="fa-solid fa-user"></i>
            Usuários
        </a>
    </nav>
</header>

<main class="pagina">

    <div class="cabecalho-pagina">
        <small>ARYN</small>
        <h2>Meus Pedidos</h2>
        <p>Todos os pedidos que você realizou.</p>
    </div>

    <div id="avisoVisitante" class="aviso-visitante" style="display:none;">
        <i class="fa-solid fa-box"></i>
        <h3>Você está como visitante</h3>
        <p>Faça login ou crie uma conta para ver seus pedidos.</p>
        <a href="cadastro.html">Criar conta</a>
        <a href="login.html">Entrar</a>
    </div>

    <div id="lista-pedidos" class="pedidos-lista"></div>

</main>

</body>
</html>
