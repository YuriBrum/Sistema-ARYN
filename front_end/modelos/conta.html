<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Conta | ARYN</title>
    <script src="../js/api.js" defer></script>
    <script src="../assets/js/autentificao.js" defer></script>
    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            if (typeof checkAuth === 'function') {
                const valid = await checkAuth({ redirectOnInvalid: true, loginPage: 'login.html' });
                if (!valid) return;
            }
            window.location.replace('usuarios.html');
        });
    </script>
</head>
<body style="margin:0; background:#000; color:#fff; font-family:Arial,sans-serif; display:grid; place-items:center; min-height:100vh;">
    <div style="text-align:center;">
        <p style="letter-spacing:0.22rem; color:#E30613; font-weight:700;">ARYN</p>
        <p>Redirecionando para sua conta...</p>
    </div>
</body>
</html>
