<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARYN - Login</title>

    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="/assets/styles/login.css">
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/carrinho.js"></script>
    <script>if (typeof bloquearSeLogado === 'function') bloquearSeLogado();</script>

    <style>
        .login-wrapper {
            max-width: 460px;
            margin: 0 auto;
        }

        .login-card {
            background: #fff;
            border-radius: 14px;
            padding: 32px;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);
            color: #111;
        }

        .login-card h3 {
            margin: 0 0 8px;
            font-size: 22px;
            color: #111;
        }

        .login-card .subtitulo {
            color: #777;
            font-size: 14px;
            margin-bottom: 22px;
        }

        .login-card .formulario {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .login-card .campo label {
            font-weight: bold;
            font-size: 14px;
            color: #111;
        }

        .login-card .campo input {
            padding: 13px 14px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 15px;
            width: 100%;
            outline: none;
            transition: border .2s;
        }

        .login-card .campo input:focus {
            border-color: #111;
        }

        .campo-senha {
            position: relative;
        }

        .campo-senha input {
            padding-right: 42px !important;
        }

        .toggle-senha {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: 0;
            color: #888;
            cursor: pointer;
            font-size: 16px;
            margin-top: 12px;
        }

        .opcoes-login {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-top: 4px;
        }

        .opcoes-login label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            color: #444;
        }

        .opcoes-login a {
            color: #111;
            text-decoration: none;
            font-weight: bold;
        }

        .opcoes-login a:hover {
            text-decoration: underline;
        }

        .btn-login {
            width: 100%;
            border: 0;
            padding: 14px;
            background: #111;
            color: #fff;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 8px;
            transition: opacity .2s, background .2s;
        }

        .btn-login:hover {
            opacity: .85;
            background: #000;
        }

        .btn-login i {
            margin-right: 6px;
        }

        .divisor {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 22px 0 18px;
            color: #aaa;
            font-size: 13px;
        }

        .divisor::before,
        .divisor::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #eee;
        }

        .criar-conta {
            text-align: center;
            font-size: 14px;
            color: #555;
        }

        .criar-conta a {
            color: #d91d1d;
            font-weight: bold;
            text-decoration: none;
        }

        .criar-conta a:hover {
            text-decoration: underline;
        }

        .erro-msg {
            display: none;
            background: #fee;
            color: #b11d1d;
            border: 1px solid #fcc;
            padding: 10px 12px;
            border-radius: 7px;
            font-size: 13px;
        }

        .erro-msg.visivel {
            display: block;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">
        <h1><span>A</span>RYN</h1>
        <p>Vista sua essência</p>
    </div>

    <nav>
        <a href="../index.html">
            <i class="fa-solid fa-house"></i>
            Home
        </a>

        <a href="masculino.html">
            <i class="fa-solid fa-person"></i>
            Masculino
        </a>

        <a href="feminino.html">
            <i class="fa-solid fa-person-dress"></i>
            Feminino
        </a>
    </nav>

    <nav>
        <a href="../index.html">
            <i class="fa-solid fa-store"></i>
            Loja
        </a>

        <a href="carrinho.html">
            <i class="fa-solid fa-cart-shopping"></i>
            Carrinho
        </a>

        <a href="login.html" class="active">
            <i class="fa-solid fa-user"></i>
            Entrar
        </a>
    </nav>
</header>

<main class="pagina">

    <div class="cabecalho-pagina" style="text-align: center;">
        <small>ARYN</small>
        <h2>Bem-vindo de volta</h2>
        <p>Entre com seu e-mail ou telefone para continuar.</p>
    </div>

    <div class="login-wrapper">
        <div class="login-card">

            <h3>Entrar na sua conta</h3>
            <p class="subtitulo">Acesse seus pedidos, favoritos e dados.</p>

            <div id="erro" class="erro-msg"></div>

            <form class="formulario" onsubmit="fazerLogin(event)" novalidate>

                <div class="campo">
                    <label for="usuario">E-mail ou telefone</label>
                    <input type="text" id="usuario" name="usuario"
                           placeholder="ex: cliente@aryn.com ou (11) 99999-9999"
                           autocomplete="username" required>
                </div>

                <div class="campo campo-senha">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha"
                           placeholder="Digite sua senha"
                           autocomplete="current-password" required>
                    <button type="button" class="toggle-senha" onclick="toggleSenha()" aria-label="Mostrar senha">
                        <i id="iconeSenha" class="fa-solid fa-eye"></i>
                    </button>
                </div>

                <div class="opcoes-login">
                    <label>
                        <input type="checkbox" id="lembrar">
                        Lembrar-me
                    </label>
                    <a href="#" onclick="esqueceuSenha(event)">Esqueceu a senha?</a>
                </div>

                <button type="submit" class="btn-login">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    Entrar
                </button>

            </form>

            <div class="divisor">ou</div>

            <p class="criar-conta">
                Não tem conta? <a href="cadastro.html">Criar conta</a> · <a href="../index.html">Continuar como visitante</a>
            </p>

        </div>
    </div>

</main>

<script src="/assets/js/login.js"></script>

</body>
</html>
