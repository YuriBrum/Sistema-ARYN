<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <title>Entrar | ARYN</title>
    <link rel="stylesheet" href="../assets/styles/login.css">
    <script src="../js/api.js" defer></script>
    <script src="../assets/js/login.js" defer></script>
</head>
<body class="login-page">
    <div class="login-shell">
        <header class="login-header">
            <a class="login-logo" href="../../index.html" aria-label="ARYN, voltar para a loja">ARYN</a>
        </header>

        <main class="login-main">
            <section class="login-card" aria-labelledby="loginTitle">
                <div class="login-heading">
                    <p class="login-kicker">Moda masculina contemporânea</p>
                    <h1 class="login-title" id="loginTitle">Bem-vindo de volta</h1>
                    <p class="login-subtitle">Entre na sua conta ARYN para continuar.</p>
                </div>

                <p class="login-error" id="loginError" role="alert" aria-live="polite"></p>

                <form class="login-form" id="loginForm" novalidate>
                    <div class="login-field">
                        <label for="email">E-mail</label>
                        <input id="email" name="email" type="email" placeholder="Digite seu e-mail" autocomplete="email" required>
                    </div>

                    <div class="login-field">
                        <label for="senha">Senha</label>
                        <div class="password-control">
                            <input id="senha" name="senha" type="password" placeholder="Digite sua senha" autocomplete="current-password" required>
                            <button class="password-toggle" id="passwordToggle" type="button" aria-label="Mostrar senha">◉</button>
                        </div>
                    </div>

                    <div class="login-options">
                        <label class="remember-label" for="lembrar">
                            <input id="lembrar" name="lembrar" type="checkbox">
                            Lembrar de mim
                        </label>
                        <a class="login-link" href="recuperar-senha.html">Esqueci minha senha</a>
                    </div>

                    <button class="login-submit" id="loginSubmit" type="submit">ENTRAR</button>
                </form>

                <div class="login-divider" aria-hidden="true">ou</div>

                <button class="social-button" type="button" disabled title="Login social ainda não configurado">
                    Continuar com Google
                </button>

                <p class="login-signup">Ainda não possui uma conta? <a href="cadastro.html">CRIAR CONTA</a></p>
                <a class="login-back" href="../../index.html">Voltar para a loja</a>
            </section>
        </main>

        <footer class="login-footer">© 2026 ARYN. Todos os direitos reservados.</footer>
    </div>
</body>
</html>
